services:
  playwright-tests:
    build: .
    init: true
    user: root
    ipc: host
    env_file:
      - .env
    command: sh -c "cat .env && npx playwright test"
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./allure-reports:/app/allure-reports
      - ./custom-reports:/app/custom-reports
      - ./reports:/app/reports
      - ./test-results:/app/test-results
      - ./trace:/app/trace
      - ./traces:/app/traces